services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RESET_BOOTSTRAP_ADMIN_PASSWORD: ${RESET_BOOTSTRAP_ADMIN_PASSWORD:-false}
      DEMO_ADMIN_PHONE: ${DEMO_ADMIN_PHONE:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_API_BASE_URL: ${DEMO_API_BASE_URL:-http://127.0.0.1:8000/api}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ECOURTS_SEARCH_URL: ${ECOURTS_SEARCH_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  redis_data: